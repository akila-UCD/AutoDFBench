services:
  autodfbench:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: akila1989/autodfbench-api:1.1.0
    container_name: autodfbench
    ports:
      - "8000-8004:8000-8004"
    volumes:
      - ./results:/app/results          # evaluation results database (write_db=true)
      - ./Data:/app/Data:ro             # optional: file-carving / registry source data
    restart: unless-stopped
