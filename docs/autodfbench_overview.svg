<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How AutoDFBench works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4e89"/>
    </marker>
    <marker id="arrow-gt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="1000" height="580" rx="14" fill="#ffffff"/>

  <!-- NIST test data (database) -->
  <g>
    <path d="M494,32 v50 a130,12 0 0 0 260,0 v-50" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
    <ellipse cx="624" cy="32" rx="130" ry="12" fill="#dbe6f4" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="624" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">NIST CFTT / CFReDS</text>
    <text x="624" y="82" text-anchor="middle" font-size="13" fill="#1f2933">test data</text>
  </g>

  <!-- Tool under test -->
  <rect x="494" y="128" width="260" height="62" rx="8" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">Tool under test</text>
  <text x="624" y="173" text-anchor="middle" font-size="12" fill="#1f2933">DF tool, script, LLM-generated code or agent</text>
  <line x1="624" y1="96" x2="624" y2="126" stroke="#1d4e89" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tool -> APIs -->
  <g stroke="#1d4e89" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="604" y1="190" x2="344" y2="246"/>
    <line x1="614" y1="190" x2="484" y2="246"/>
    <line x1="624" y1="190" x2="624" y2="246"/>
    <line x1="634" y1="190" x2="764" y2="246"/>
    <line x1="644" y1="190" x2="904" y2="246"/>
  </g>

  <!-- Five task APIs -->
  <g font-size="13" text-anchor="middle">
    <rect x="280" y="248" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="344" y="270" font-weight="bold" fill="#1d4e89">String</text>
    <text x="344" y="286" font-weight="bold" fill="#1d4e89">Search API</text>
    <text x="344" y="305" font-size="12" fill="#1f2933">port 8000</text>
    <text x="344" y="330" font-size="11" font-style="italic" fill="#52606d">strings found</text>

    <rect x="420" y="248" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="484" y="270" font-weight="bold" fill="#1d4e89">Deleted File</text>
    <text x="484" y="286" font-weight="bold" fill="#1d4e89">Recovery API</text>
    <text x="484" y="305" font-size="12" fill="#1f2933">port 8001</text>
    <text x="484" y="330" font-size="11" font-style="italic" fill="#52606d">files, blocks, times</text>

    <rect x="560" y="248" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="624" y="270" font-weight="bold" fill="#1d4e89">File</text>
    <text x="624" y="286" font-weight="bold" fill="#1d4e89">Carving API</text>
    <text x="624" y="305" font-size="12" fill="#1f2933">port 8002</text>
    <text x="624" y="330" font-size="11" font-style="italic" fill="#52606d">carved files</text>

    <rect x="700" y="248" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="764" y="270" font-weight="bold" fill="#1d4e89">Windows</text>
    <text x="764" y="286" font-weight="bold" fill="#1d4e89">Registry API</text>
    <text x="764" y="305" font-size="12" fill="#1f2933">port 8003</text>
    <text x="764" y="330" font-size="11" font-style="italic" fill="#52606d">registry keys (CSV)</text>

    <rect x="840" y="248" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="904" y="270" font-weight="bold" fill="#1d4e89">SQLite</text>
    <text x="904" y="286" font-weight="bold" fill="#1d4e89">Recovery API</text>
    <text x="904" y="305" font-size="12" fill="#1f2933">port 8004</text>
    <text x="904" y="330" font-size="11" font-style="italic" fill="#52606d">header, schema, rows</text>
  </g>

  <!-- APIs -> Compare -->
  <g stroke="#1d4e89" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="344" y1="342" x2="470" y2="398"/>
    <line x1="484" y1="342" x2="547" y2="398"/>
    <line x1="624" y1="342" x2="624" y2="398"/>
    <line x1="764" y1="342" x2="701" y2="398"/>
    <line x1="904" y1="342" x2="778" y2="398"/>
  </g>

  <!-- Compare -->
  <rect x="424" y="400" width="400" height="62" rx="8" fill="#d6e4f5" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">Compare with the ground truth</text>
  <text x="624" y="445" text-anchor="middle" font-size="12.5" fill="#1f2933">TP, FP, FN, precision, recall, F1</text>

  <!-- Score -->
  <line x1="624" y1="462" x2="624" y2="496" stroke="#1d4e89" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="514" y="498" width="220" height="56" rx="8" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="521" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">AutoDFBench Score</text>
  <text x="624" y="540" text-anchor="middle" font-size="12" fill="#1f2933">average F1 over the test cases</text>

  <!-- Ground truth (database), built from the NIST test data, feeds Compare from the left -->
  <path d="M492,57 H150 V384" fill="none" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-gt)"/>
  <text x="162" y="200" font-size="12" font-style="italic" fill="#7a5c00">ground truth built from</text>
  <text x="162" y="216" font-size="12" font-style="italic" fill="#7a5c00">the NIST test data</text>
  <g>
    <path d="M30,398 v62 a120,12 0 0 0 240,0 v-62" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <ellipse cx="150" cy="398" rx="120" ry="12" fill="#fdecb3" stroke="#b8860b" stroke-width="1.5"/>
    <text x="150" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5c00">Ground truth</text>
    <text x="150" y="446" text-anchor="middle" font-size="11.5" fill="#1f2933">autodfbench_gt.sqlite</text>
    <text x="150" y="461" text-anchor="middle" font-size="11.5" fill="#1f2933">+ Data/ (carving, registry)</text>
  </g>
  <line x1="272" y1="431" x2="421" y2="431" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow-gt)"/>
</svg>
