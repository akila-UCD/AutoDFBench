<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How AutoDFBench works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4e89"/>
    </marker>
    <marker id="arrow-gt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="1000" height="482" rx="14" fill="#ffffff"/>

  <!-- NIST test data (database): source of the ground truth -->
  <g>
    <path d="M30,32 v50 a120,12 0 0 0 240,0 v-50" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
    <ellipse cx="150" cy="32" rx="120" ry="12" fill="#dbe6f4" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="150" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">NIST CFTT / CFReDS</text>
    <text x="150" y="82" text-anchor="middle" font-size="13" fill="#1f2933">test data</text>
  </g>
  <line x1="150" y1="96" x2="150" y2="284" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-gt)"/>
  <text x="140" y="182" text-anchor="end" font-size="12" font-style="italic" fill="#7a5c00">ground truth</text>
  <text x="140" y="198" text-anchor="end" font-size="12" font-style="italic" fill="#7a5c00">built from the</text>
  <text x="140" y="214" text-anchor="end" font-size="12" font-style="italic" fill="#7a5c00">NIST test data</text>

  <!-- Tool under test -->
  <rect x="484" y="30" width="280" height="74" rx="8" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">Tool under test</text>
  <text x="624" y="73" text-anchor="middle" font-size="12" fill="#1f2933">DF tool, script, LLM-generated code or agent</text>
  <text x="624" y="91" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">runs the AutoDFBench test cases</text>

  <!-- Tool -> APIs -->
  <g stroke="#1d4e89" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="604" y1="104" x2="344" y2="148"/>
    <line x1="614" y1="104" x2="484" y2="148"/>
    <line x1="624" y1="104" x2="624" y2="148"/>
    <line x1="634" y1="104" x2="764" y2="148"/>
    <line x1="644" y1="104" x2="904" y2="148"/>
  </g>

  <!-- Five task APIs -->
  <g font-size="13" text-anchor="middle">
    <rect x="280" y="150" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="344" y="172" font-weight="bold" fill="#1d4e89">String</text>
    <text x="344" y="188" font-weight="bold" fill="#1d4e89">Search API</text>
    <text x="344" y="207" font-size="12" fill="#1f2933">port 8000</text>
    <text x="344" y="232" font-size="11" font-style="italic" fill="#52606d">strings found</text>

    <rect x="420" y="150" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="484" y="172" font-weight="bold" fill="#1d4e89">Deleted File</text>
    <text x="484" y="188" font-weight="bold" fill="#1d4e89">Recovery API</text>
    <text x="484" y="207" font-size="12" fill="#1f2933">port 8001</text>
    <text x="484" y="232" font-size="11" font-style="italic" fill="#52606d">files, blocks, times</text>

    <rect x="560" y="150" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="624" y="172" font-weight="bold" fill="#1d4e89">File</text>
    <text x="624" y="188" font-weight="bold" fill="#1d4e89">Carving API</text>
    <text x="624" y="207" font-size="12" fill="#1f2933">port 8002</text>
    <text x="624" y="232" font-size="11" font-style="italic" fill="#52606d">carved files</text>

    <rect x="700" y="150" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="764" y="172" font-weight="bold" fill="#1d4e89">Windows</text>
    <text x="764" y="188" font-weight="bold" fill="#1d4e89">Registry API</text>
    <text x="764" y="207" font-size="12" fill="#1f2933">port 8003</text>
    <text x="764" y="232" font-size="11" font-style="italic" fill="#52606d">registry keys (CSV)</text>

    <rect x="840" y="150" width="128" height="94" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="904" y="172" font-weight="bold" fill="#1d4e89">SQLite</text>
    <text x="904" y="188" font-weight="bold" fill="#1d4e89">Recovery API</text>
    <text x="904" y="207" font-size="12" fill="#1f2933">port 8004</text>
    <text x="904" y="232" font-size="11" font-style="italic" fill="#52606d">header, schema, rows</text>
  </g>

  <!-- APIs -> Compare -->
  <g stroke="#1d4e89" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="344" y1="244" x2="470" y2="300"/>
    <line x1="484" y1="244" x2="547" y2="300"/>
    <line x1="624" y1="244" x2="624" y2="300"/>
    <line x1="764" y1="244" x2="701" y2="300"/>
    <line x1="904" y1="244" x2="778" y2="300"/>
  </g>

  <!-- Compare -->
  <rect x="424" y="302" width="400" height="62" rx="8" fill="#d6e4f5" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">Compare with the ground truth</text>
  <text x="624" y="347" text-anchor="middle" font-size="12.5" fill="#1f2933">TP, FP, FN, precision, recall, F1</text>

  <!-- Score -->
  <line x1="624" y1="364" x2="624" y2="398" stroke="#1d4e89" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="514" y="400" width="220" height="56" rx="8" fill="#eef3fa" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="624" y="423" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4e89">AutoDFBench Score</text>
  <text x="624" y="442" text-anchor="middle" font-size="12" fill="#1f2933">average F1 over the test cases</text>

  <!-- Ground truth (database) feeds Compare from the left -->
  <g>
    <path d="M30,300 v62 a120,12 0 0 0 240,0 v-62" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <ellipse cx="150" cy="300" rx="120" ry="12" fill="#fdecb3" stroke="#b8860b" stroke-width="1.5"/>
    <text x="150" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5c00">Ground truth</text>
    <text x="150" y="348" text-anchor="middle" font-size="11.5" fill="#1f2933">autodfbench_gt.sqlite</text>
    <text x="150" y="363" text-anchor="middle" font-size="11.5" fill="#1f2933">+ Data/ (carving, registry)</text>
  </g>
  <line x1="272" y1="333" x2="421" y2="333" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow-gt)"/>
</svg>
